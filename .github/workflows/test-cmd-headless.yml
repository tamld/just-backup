name: RoboSync CMD Headless — Test Suite

on:
  push:
    paths:
      - 'cmd_headless/**'
      - '.github/workflows/test-cmd-headless.yml'
  pull_request:
    paths:
      - 'cmd_headless/**'
      - '.github/workflows/test-cmd-headless.yml'

jobs:
  test-cmd-batch:
    name: Static Lint + Worst-Case + Parser Traps + Runtime
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify test files exist
        shell: pwsh
        working-directory: cmd_headless
        run: |
          $files = @(
            "RoboSync.bat",
            "dist/RoboSync_Portable.bat",
            "test_harness.ps1",
            "lib/engine.bat",
            "lib/network.bat",
            "lib/discover.bat",
            "lib/ui.bat"
          )
          $missing = $files | Where-Object { -not (Test-Path $_) }
          if ($missing.Count -gt 0) {
            Write-Host "Missing files: $($missing -join ', ')" -ForegroundColor Red
            exit 1
          }
          Write-Host "All required files present." -ForegroundColor Green

      - name: Run Test Harness (37 checks)
        shell: pwsh
        working-directory: cmd_headless
        run: |
          $result = & powershell -ExecutionPolicy Bypass -File test_harness.ps1
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Host "::error::Test harness failed with $exitCode failures."
          }
          exit $exitCode
